---
deployment:
  tasks:
    - export DEPLOYPATH=/home/wbqoqaid/meal.krishdesigns.com
    - /bin/cp index.html privacy.html app.js app.css sw.js api.php db.php mail.php .htaccess manifest.json icon-192.png icon-512.png icon-maskable-192.png icon-maskable-512.png apple-touch-icon.png favicon.ico favicon.svg favicon-32.png favicon-16.png $DEPLOYPATH/
    - /bin/mkdir -p $DEPLOYPATH/fonts $DEPLOYPATH/data $DEPLOYPATH/splash
    - /bin/cp splash/*.png $DEPLOYPATH/splash/
    - /bin/cp fonts/*.woff2 $DEPLOYPATH/fonts/
    - /bin/cp data/.htaccess $DEPLOYPATH/data/
    - /bin/mkdir -p $DEPLOYPATH/.well-known && /bin/cp .well-known/security.txt $DEPLOYPATH/.well-known/
    - /bin/cp setup.php backup.php $DEPLOYPATH/
